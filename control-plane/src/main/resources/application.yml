server:
  port: 8080
  address: 127.0.0.1

spring:
  application:
    name: vpn-control
  data:
    mongodb:
      # 자격증명은 절대 하드코딩하지 않음 — MONGO_URI 환경변수(.env)에서만 주입.
      # 앱 전용 최소권한 계정(vpnapp, readWrite on vpnlab)을 사용한다.
      uri: ${MONGO_URI}
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

vpn-control:
  scripts-dir: ${VPN_SCRIPTS_DIR:/Users/insuchoe/Desktop/vpn-lab/scripts}
  client-count: ${CLIENT_COUNT:5}
  blocklist:
    hosts-path: ${BLOCKLIST_HOSTS_PATH:/Users/insuchoe/Desktop/vpn-lab/server-data/blocklist/hosts}
    corefile-path: ${BLOCKLIST_COREFILE_PATH:/Users/insuchoe/Desktop/vpn-lab/server-data/coredns/Corefile}
  disk-control:
    policy-path: ${DISK_POLICY_PATH:/Users/insuchoe/Desktop/vpn-lab/disk-control/config/policy.json}
    log-path: ${DISK_LOG_PATH:/Users/insuchoe/Desktop/vpn-lab/disk-control/logs/disk-events.jsonl}
    process-pattern: ${DISK_PROCESS_PATTERN:disk-control-poc}

logging:
  level:
    com.vpnlab: DEBUG
    org.springframework.web: INFO
